# config/services.yaml

parameters:
    mailjet.api_key: '%env(MAILJET_API_KEY)%'
    mailjet.api_secret: '%env(MAILJET_API_SECRET)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Auto-wire tous tes services, sauf exceptions
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Ton service Mailjet avec injection manuelle de paramètres
    App\Service\MailjetService:
        arguments:
            $mailjetApiKey: '%mailjet.api_key%'
            $mailjetApiSecret: '%mailjet.api_secret%'

    # Déclaration explicite du contrôleur (facultatif mais utile si tu veux forcer `public`)
    App\Controller\AppointmentController:
        public: true
        tags: ['controller.service_arguments']
